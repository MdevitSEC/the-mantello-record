title: "The Mantello Record"
description: "The documented record of Mayor Carmella Mantello's controversies, failures, and overreach in Troy, NY. Sourced from council meeting transcripts, local news, and official city documents."
tagline: "Accountability journalism on Troy, NY Mayor Carmella Mantello."
url: "https://themantellorecord.com"
baseurl: ""

author:
  name: "The Mantello Record"

twitter:
  card: summary

social:
  name: The Mantello Record
  links: []

logo: "/assets/images/record.png"

email: ""

permalink: /:year/:month/:day/:title/

collections:
  posts:
    output: true
  anointed:
    output: true
    permalink: /anointed/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "anointed"
    values:
      layout: "anointed_profile"

# Categories used across the site
categories_list:
  - Legal Disputes
  - Executive Overreach
  - Financial Failures
  - Transparency
  - Community Impact

markdown: kramdown
highlighter: rouge
theme: null

plugins:
  - jekyll-feed
  - jekyll-seo-tag
